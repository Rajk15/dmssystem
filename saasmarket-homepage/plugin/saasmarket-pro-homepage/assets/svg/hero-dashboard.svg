<svg class="smp-hero-svg" viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract SaaS dashboard illustration">
  <defs>
    <linearGradient id="smpDashBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="100%" stop-color="#163A66"/>
    </linearGradient>
    <linearGradient id="smpAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A6AFF"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="smpSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0B1F3A" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="70" y="48" width="500" height="360" rx="22" fill="url(#smpDashBg)" filter="url(#smpSoft)"/>
  <rect x="70" y="48" width="500" height="46" rx="22" fill="#102848"/>
  <circle cx="98" cy="71" r="6" fill="#FF6B6B"/>
  <circle cx="118" cy="71" r="6" fill="#FFD166"/>
  <circle cx="138" cy="71" r="6" fill="#06D6A0"/>
  <rect x="170" y="63" width="160" height="16" rx="8" fill="#1E3F6B"/>

  <rect x="96" y="118" width="150" height="96" rx="14" fill="#143356"/>
  <text x="112" y="144" fill="#9DB7D8" font-family="DM Sans, sans-serif" font-size="13">CRM Pipeline</text>
  <rect x="112" y="158" width="96" height="10" rx="5" fill="url(#smpAccent)"/>
  <rect x="112" y="178" width="70" height="10" rx="5" fill="#1E4A7A"/>

  <rect x="262" y="118" width="150" height="96" rx="14" fill="#143356"/>
  <text x="278" y="144" fill="#9DB7D8" font-family="DM Sans, sans-serif" font-size="13">Automation</text>
  <path d="M278 178h90M278 198h60" stroke="#14B8A6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="278" cy="178" r="5" fill="#1A6AFF"/>
  <circle cx="320" cy="198" r="5" fill="#14B8A6"/>

  <rect x="428" y="118" width="118" height="96" rx="14" fill="#143356"/>
  <text x="444" y="144" fill="#9DB7D8" font-family="DM Sans, sans-serif" font-size="13">Analytics</text>
  <polyline points="448,196 468,176 488,184 508,158 528,168" fill="none" stroke="#1A6AFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="96" y="232" width="450" height="140" rx="14" fill="#122F52"/>
  <text x="112" y="262" fill="#9DB7D8" font-family="DM Sans, sans-serif" font-size="13">Workflow overview</text>
  <rect x="112" y="280" width="70" height="54" rx="10" fill="#1A6AFF" opacity="0.85"/>
  <rect x="196" y="296" width="70" height="38" rx="10" fill="#14B8A6" opacity="0.8"/>
  <rect x="280" y="288" width="70" height="46" rx="10" fill="#3B82F6" opacity="0.75"/>
  <rect x="364" y="304" width="70" height="30" rx="10" fill="#60A5FA" opacity="0.7"/>
  <rect x="448" y="274" width="70" height="60" rx="10" fill="#0EA5E9" opacity="0.75"/>

  <!-- Floating cards -->
  <g filter="url(#smpSoft)">
    <rect class="smp-float smp-float--a" x="28" y="210" width="132" height="72" rx="14" fill="#FFFFFF"/>
    <text x="46" y="242" fill="#0B1F3A" font-family="DM Sans, sans-serif" font-size="13" font-weight="600">CRM</text>
    <text x="46" y="262" fill="#64748B" font-family="DM Sans, sans-serif" font-size="11">Customer ops</text>
  </g>
  <g filter="url(#smpSoft)">
    <rect class="smp-float smp-float--b" x="480" y="48" width="140" height="72" rx="14" fill="#FFFFFF"/>
    <text x="498" y="80" fill="#0B1F3A" font-family="DM Sans, sans-serif" font-size="13" font-weight="600">Automation</text>
    <text x="498" y="100" fill="#64748B" font-family="DM Sans, sans-serif" font-size="11">Workflow sync</text>
  </g>
  <g filter="url(#smpSoft)">
    <rect class="smp-float smp-float--c" x="470" y="390" width="140" height="72" rx="14" fill="#FFFFFF"/>
    <text x="488" y="422" fill="#0B1F3A" font-family="DM Sans, sans-serif" font-size="13" font-weight="600">Analytics</text>
    <text x="488" y="442" fill="#64748B" font-family="DM Sans, sans-serif" font-size="11">Growth signals</text>
  </g>

  <path d="M160 246 C210 246, 230 160, 480 120" stroke="#1A6AFF" stroke-opacity="0.35" stroke-width="2" fill="none" stroke-dasharray="4 6"/>
  <path d="M540 120 C560 220, 540 320, 540 390" stroke="#14B8A6" stroke-opacity="0.35" stroke-width="2" fill="none" stroke-dasharray="4 6"/>
</svg>
